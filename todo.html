<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Checklist</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 16px;
      min-height: 100vh;
    }
    .app {
      background: #fff;
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.2);
      padding: 28px;
      height: fit-content;
    }
    h1 { font-size: 1.6rem; margin-bottom: 4px; color: #1a1a2e; }
    .subtitle { color: #999; font-size: 0.85rem; margin-bottom: 22px; }
    .input-row { display: flex; gap: 8px; margin-bottom: 8px; }
    #new-task {
      flex: 1;
      padding: 13px 14px;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color .15s;
    }
    #new-task:focus { border-color: #667eea; }
    #add-btn {
      padding: 0 22px;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    #add-btn:hover { background: #5568d3; }
    .filters { display: flex; gap: 6px; margin: 16px 0 4px; }
    .filters button {
      flex: 1;
      padding: 7px;
      background: #f4f5f7;
      border: none;
      border-radius: 8px;
      font-size: 0.82rem;
      color: #666;
      cursor: pointer;
    }
    .filters button.active { background: #667eea; color: #fff; }
    ul { list-style: none; margin-top: 8px; }
    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 8px;
      border-bottom: 1px solid #f2f2f2;
      animation: slide .2s ease;
    }
    @keyframes slide { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; } }
    li input[type="checkbox"] { width: 19px; height: 19px; cursor: pointer; accent-color: #667eea; }
    li .text { flex: 1; font-size: 1rem; color: #333; word-break: break-word; }
    li.done .text { text-decoration: line-through; color: #bbb; }
    .delete {
      background: none;
      border: none;
      color: #ccc;
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
    }
    .delete:hover { color: #ff5b5b; }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      font-size: 0.85rem;
      color: #999;
    }
    .clear { background: none; border: none; color: #999; cursor: pointer; }
    .clear:hover { color: #ff5b5b; }
    .empty { text-align: center; color: #ccc; padding: 28px 0; }
  </style>
</head>
<body>
  <div class="app">
    <h1>My Todo List</h1>
    <p class="subtitle">Stay on top of your tasks</p>
    <div class="input-row">
      <input type="text" id="new-task" placeholder="Add a new task..." autocomplete="off">
      <button id="add-btn">Add</button>
    </div>
    <div class="filters">
      <button data-filter="all" class="active">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="done">Completed</button>
    </div>
    <ul id="list"></ul>
    <div class="footer">
      <span id="count">0 tasks left</span>
      <button class="clear" id="clear-done">Clear completed</button>
    </div>
  </div>

  <script>
    const input = document.getElementById('new-task');
    const addBtn = document.getElementById('add-btn');
    const list = document.getElementById('list');
    const count = document.getElementById('count');
    const clearBtn = document.getElementById('clear-done');
    const filterBtns = document.querySelectorAll('.filters button');

    let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
    let filter = 'all';

    const save = () => localStorage.setItem('tasks', JSON.stringify(tasks));

    function render() {
      list.innerHTML = '';
      const visible = tasks.filter(t =>
        filter === 'all' ? true : filter === 'active' ? !t.done : t.done
      );

      if (visible.length === 0) {
        list.innerHTML = '<li class="empty">Nothing here yet!</li>';
      }

      visible.forEach(task => {
        const i = tasks.indexOf(task);
        const li = document.createElement('li');
        if (task.done) li.classList.add('done');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.done;
        checkbox.addEventListener('change', () => {
          tasks[i].done = checkbox.checked;
          save(); render();
        });

        const span = document.createElement('span');
        span.className = 'text';
        span.textContent = task.text;

        const del = document.createElement('button');
        del.className = 'delete';
        del.innerHTML = '&times;';
        del.addEventListener('click', () => {
          tasks.splice(i, 1);
          save(); render();
        });

        li.append(checkbox, span, del);
        list.appendChild(li);
      });

      const left = tasks.filter(t => !t.done).length;
      count.textContent = `${left} task${left !== 1 ? 's' : ''} left`;
    }

    function addTask() {
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ text, done: false });
      input.value = '';
      save(); render();
    }

    addBtn.addEventListener('click', addTask);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
    clearBtn.addEventListener('click', () => {
      tasks = tasks.filter(t => !t.done);
      save(); render();
    });
    filterBtns.forEach(btn => btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      render();
    }));

    render();
  </script>
</body>
</html>
